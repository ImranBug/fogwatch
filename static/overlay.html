<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/img/favicon.png">
<title>Fogwatch overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Transparent HUD drawn over the game by overlay.py (?pos=left|right|top, ?scale=1, ?mock, ?mock&sc=calm|warn|high|missing|smoke|listen|heard|quiet|timer|fog_*, &small=1 = MacBook frame). No pointer interaction.
   Empty when calm, and never more than ONE pill: the action, coloured by severity. Same severity tokens as the dashboard; motion fires once and holds (only the minimap ping loops while a threat exists). */
:root{--ink:#ece4d2;--ink-2:#a89f8c;--warn:#ffb02e;--high:#ff4d4f;--s:1;
  --f-ui:"Barlow Semi Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent!important;overflow:hidden;height:100%;pointer-events:none;user-select:none}
html{font-size:calc(16px * var(--s))}
body{color:var(--ink);font:700 1rem/1.15 var(--f-ui);font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:.04em}
#hud{position:fixed;display:flex;flex-direction:column;gap:.45rem;transition:opacity .3s}
#hud.left{left:1.2vw;top:50%;transform:translateY(-50%);align-items:flex-start}
#hud.right{right:1.2vw;top:42%;transform:translateY(-50%);align-items:flex-end}   /* clear of the bottom-right minimap */
#hud.top{top:7.5vh;left:50%;transform:translateX(-50%);flex-direction:row;align-items:center}   /* below Dota's top bar */
#hud.calm{opacity:0}
/* Dota-style notification panel: near-square, dark vertical gradient, 3px accent bar in the level colour */
.pill{--c:var(--ink-2);display:flex;align-items:center;gap:.5rem;padding:.35rem .8rem .35rem .7rem;border-radius:3px;font-size:1.15rem;white-space:nowrap;
  background:linear-gradient(180deg,rgba(27,35,45,.88),rgba(16,21,28,.88));box-shadow:0 0 0 1px #07090c,inset 3px 0 0 var(--c),inset 0 1px 0 rgba(255,236,200,.08),0 4px 12px rgba(0,0,0,.5);
  text-shadow:0 1px 2px #000;animation:in .3s ease-out 1}
.pill[hidden]{display:none}
.pill.warn{--c:var(--warn)}.pill.high{--c:var(--high)}
.ico{width:1.3em;height:1.3em;flex:none;color:var(--c)}
.pill.big.warn{font-size:2.2rem;padding:.45rem 1.1rem .45rem 1rem;box-shadow:0 0 0 1px #07090c,inset 5px 0 0 var(--warn),inset 0 1px 0 rgba(255,236,200,.08),0 4px 12px rgba(0,0,0,.5);
  background:linear-gradient(180deg,rgba(74,54,20,.92),rgba(36,27,12,.92));animation:in 2s ease-out 1}
.pill.big.high{font-size:2.7rem;padding:.5rem 1.2rem .5rem 1.1rem;color:#fff;box-shadow:0 0 0 1px #07090c,0 0 0 3px #ff4d4f99,inset 0 0 40px #ff3b3055,0 4px 16px rgba(0,0,0,.6);
  background:linear-gradient(180deg,rgba(122,28,24,.94),rgba(42,10,12,.94));animation:pop .5s ease-out 1}
.pill.big.high .ico{color:#fff}
.pill small{font-size:.9em;font-weight:600;opacity:.9;max-width:26em;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0}
.pill.big small{font-size:.45em}
.pill.talk{--c:var(--ink);font-size:1.35rem}
@keyframes in{from{opacity:0}}
@keyframes pop{from{transform:scale(1.15);opacity:0}to{transform:none;opacity:1}}
.meter{display:flex;gap:.18rem}.meter i{width:.9rem;height:.7rem;background:rgba(255,255,255,.16)}.meter i.on{background:var(--c)}
.pill.big.high .meter i.on{background:#fff}
/* QUIET / VOICE OFF: a marker, not a pill. It is the only thing on screen when the map is calm and the coach was told to be quiet. */
#q{font-size:.8rem;letter-spacing:.16em;color:var(--ink-2);padding:.12rem .5rem;border-radius:2px;background:rgba(16,21,28,.62);text-shadow:0 1px 2px #000}
#q[hidden]{display:none}
/* danger direction: edge arrows (toward the threat from my hero), static red edge band, marks on the real minimap */
#fx{position:fixed;inset:0}
#glow{position:fixed;inset:0;opacity:0;transition:opacity .3s ease-out}
#glow.on{opacity:1}
.arw{position:fixed;width:0;height:0}
.arw .rot{position:absolute;left:0;top:0;transform:rotate(var(--a))}
.arw .chev{position:absolute;left:-2.8rem;top:-2.8rem;width:5.6rem;height:5.6rem;animation:nudge .45s ease-in-out 4 alternate;filter:drop-shadow(0 0 .5rem rgba(0,0,0,.9))}
@keyframes nudge{from{transform:translateX(-.5rem)}to{transform:translateX(.7rem)}}
.arw .lab{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:.3rem;padding:.25rem .6rem .25rem .5rem;border-radius:3px;font-size:1.2rem;white-space:nowrap;
  text-shadow:0 1px 2px #000;background:linear-gradient(180deg,rgba(27,35,45,.88),rgba(16,21,28,.88));box-shadow:0 0 0 1px #07090c,inset 3px 0 0 var(--c)}
.arw .lab.smoke{outline:2px dashed var(--c);outline-offset:2px}
.arw .lab img{width:2.6rem;height:2.6rem;border-radius:2px}
/* an enemy comes into sight near me: its label pops in big and flashes red twice (user 2026-11-24: notice it without looking at the minimap). Once per arrow node */
.arw .lab.seen{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both,flash .5s ease-out .45s 2}
.arw .lab.seen img{width:3.2rem;height:3.2rem}
@keyframes pop{from{transform:translate(-50%,-50%) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes flash{from{box-shadow:0 0 0 1px #07090c,inset 3px 0 0 var(--c),0 0 0 .2rem var(--high),0 0 1.6rem var(--high)}to{box-shadow:0 0 0 1px #07090c,inset 3px 0 0 var(--c),0 0 0 0 transparent,0 0 0 transparent}}
.arw .lab .ico{width:1.6rem;height:1.6rem}
#mm{position:fixed;inset:0;width:100%;height:100%;overflow:visible}
#mm .ping{animation:ping 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}   /* allowed loop: only while the threat exists */
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
/* MIC badge: you are being heard (push-to-talk held / open mic speech) or the coach is answering. Small, left edge, never covers a call. */
#mic{position:fixed;left:1.2vw;top:24%;display:flex;align-items:center;gap:.4rem;padding:.25rem .55rem;border-radius:3px;font-size:.8rem;letter-spacing:.14em;
  background:rgba(16,21,28,.72);box-shadow:0 0 0 1px #07090c,inset 3px 0 0 var(--c);text-shadow:0 1px 2px #000;--c:var(--high);transition:opacity .2s}
#mic[hidden]{display:none}
#mic.think,#mic.speak{--c:var(--ink-2)}
#mic .dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);box-shadow:0 0 .4rem var(--c)}
#mic .wave{display:flex;align-items:center;gap:.14rem;height:1rem}
#mic .wave i{width:.18rem;height:100%;border-radius:1px;background:var(--ink);transform-origin:center;animation:wv .9s ease-in-out infinite alternate}
#mic .wave i:nth-child(2){animation-delay:-.3s;animation-duration:.7s}#mic .wave i:nth-child(3){animation-delay:-.6s;animation-duration:1.1s}
#mic .wave i:nth-child(4){animation-delay:-.15s;animation-duration:.8s}#mic .wave i:nth-child(5){animation-delay:-.45s}
#mic.think .wave i{animation-duration:1.6s;opacity:.6}
@keyframes wv{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
/* FOG LAYER (W.hud.fog, sent by fog.py): where each unseen enemy was last seen (its real icon, greyed, on the real minimap), who is missing for how
   long (strip above the minimap), and an amber cue when one could reach me. Grey or amber only: red, the pill and the glow stay with enemies in sight.
   Nothing here loops: a change is one .4s opacity transition and the DOM is written only when a quantized value changes. */
#mm .gh{transition:opacity .4s}
#mm .gh circle{fill:rgba(16,21,28,.75);stroke:var(--ink-2);stroke-width:1.5}
#mm .gh image{filter:url(#fgd)}
#mm .gh.hint circle{stroke-dasharray:3 2}   /* placed by a summon, not by a sighting */
#mm .gh.cue circle{stroke:var(--warn);stroke-width:2}
#mm .gh.cue image{filter:url(#fgc)}
/* ENEMY RADAR: one icon per enemy, anchored at its centre (zero-size .en); every move and fade is a CSS transition, the pop runs once */
#radar .en{position:fixed;width:0;height:0;transition:left .35s ease-out,top .35s ease-out,opacity .4s;--s:1;--g:0;--ch:1;--rg:0;--c:var(--warn)}
#radar .en.seen{--c:var(--high)}#radar .en.ally{--c:#4fd18b}#radar .en.tray,#radar .en.dead{--c:#3a4452}
#radar img{position:absolute;left:0;top:0;width:3rem;height:3rem;border-radius:3px;transform:translate(-50%,-50%) scale(var(--s));
  filter:grayscale(var(--g)) brightness(calc(1 - var(--g) * .4)) drop-shadow(0 .1rem .35rem rgba(0,0,0,.9));transition:transform .35s ease-out,filter .4s}
#radar .rot{position:absolute;left:0;top:0;transform:rotate(var(--a,0rad));opacity:var(--ch);transition:opacity .5s}
#radar .chev{position:absolute;left:calc(1.6rem * var(--s) + .1rem);top:-1rem;width:2rem;height:2rem;fill:var(--c);stroke:#000;stroke-width:1;filter:drop-shadow(0 0 .3rem #000)}
#radar .ring{position:absolute;left:0;top:0;width:3.8rem;height:3.8rem;border:2px dashed var(--c);border-radius:50%;transform:translate(-50%,-50%) scale(var(--s));opacity:var(--rg);transition:opacity .5s,transform .35s}
#radar span{position:absolute;left:0;top:calc(1.5rem * var(--s) + .15rem);transform:translateX(-50%);font-size:.85rem;color:var(--ink-2);text-shadow:0 1px 2px #000;white-space:nowrap;text-transform:none;letter-spacing:0}
#radar .en.pop img{animation:rpop .45s cubic-bezier(.2,1.6,.4,1) both,rflash .5s ease-out .45s 2}
@keyframes rpop{from{transform:translate(-50%,-50%) scale(calc(var(--s) * 2.4));opacity:0}}
@keyframes rflash{from{filter:drop-shadow(0 0 .5rem var(--high)) drop-shadow(0 0 1.2rem var(--high))}}
#radar .en.hot .chev{transform-origin:30% 50%;animation:rpulse .5s ease-in-out infinite alternate}   /* allowed loop: only while a gank looks close */
@keyframes rpulse{from{transform:scale(1)}to{transform:scale(1.6) translateX(.25rem)}}
.arw.fog .chev{left:calc(var(--z) / -2);top:calc(var(--z) / -2);width:var(--z);height:var(--z);animation:none}
.arw.fog.t1{--z:3.2rem;opacity:.6}.arw.fog.t2{--z:5rem}
.arw.fog.go .chev{animation:nudge .45s ease-in-out 2 alternate}   /* twice, at the onset of a close cue only */
.arw .lab{left:var(--lx);top:var(--ly)}   /* fog path: the label offset comes from the arrow node (the old path writes it inline) */
.arw.fog .lab{padding:.25rem .5rem}
.arw.fog.t1 .lab{padding:.15rem .3rem;box-shadow:0 0 0 1px #07090c}.arw.fog.t1 .lab img{width:1.9rem;height:1.9rem}
.arw .drain{position:absolute;left:3px;right:0;bottom:0;height:4px;background:rgba(255,255,255,.14)}.arw .drain b{display:block;height:100%;background:var(--c)}
.arw.fog.t1 .drain{display:none}
@media (prefers-reduced-motion: reduce){#radar .en.pop img,#radar .en.hot .chev,.pill,.pill.big,.arw .chev,.arw .lab.seen,.arw.fog.go .chev,#mm .ping{animation:none}#glow,#mm .gh,.chip{transition:none}}
</style>
</head>
<body>
<div id="fx"><div id="glow"></div><div id="arrows"></div><svg id="mm"></svg><div id="radar"></div></div>
<svg width="0" height="0" style="position:fixed"><filter id="fgd" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values=".3"/></filter><filter id="fgc" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values=".85"/></filter></svg>
<div id="mic" hidden><span class="dot"></span><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span id="micl"></span></div>
<div id="hud" class="left calm">
  <div id="pill" class="pill" hidden></div>
  <div id="q" hidden></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search);
// ponytail: icon subset copied from index.html (no shared static route); keep in sync
const S = 'fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"', F = 'fill="currentColor"',
  K = 'fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"', KF = 'fill="#000"';
const ICONS = {
  danger: `<path ${F} d="M12 1.5 23.2 21.5H.8z"/><path ${K} d="M12 8.5v6M12 18v.2"/>`,
  smoke: `<path ${F} d="M6.5 20h11a4.5 4.5 0 0 0 .8-8.93A6.5 6.5 0 0 0 5.6 9.6 5.2 5.2 0 0 0 6.5 20z"/>`,
  rosh: `<path ${S} d="M3 2.5c0 5 2 7.5 5.5 7.5M21 2.5c0 5-2 7.5-5.5 7.5"/><circle ${F} cx="12" cy="14.5" r="7.5"/><circle ${KF} cx="9" cy="13.5" r="1.6"/><circle ${KF} cx="15" cy="13.5" r="1.6"/><path ${K} d="M9.5 18.5h5"/>`,
  missing: `<path ${S} d="M1.8 12S5.6 5 12 5s10.2 7 10.2 7-3.8 7-10.2 7S1.8 12 1.8 12z"/><circle ${F} cx="12" cy="12" r="3"/><path ${S} d="M3.5 21 20.5 3"/>`,
  back: `<path ${S} stroke-width="3" d="M10 4 4 10l6 6M4 10h10a6 6 0 0 1 6 6v4"/>`,
  buyback: `<path ${S} d="M20.5 12A8.5 8.5 0 1 1 18 6M20.5 2.5v4.5H16"/><circle ${F} cx="12" cy="12" r="3.5"/>`,
  item: `<path ${S} d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/><path ${F} d="M4 8h16l-1.6 13.5H5.6z"/>`,
  rune: `<path ${F} d="M12 1.5 20.5 12 12 22.5 3.5 12z"/><path ${K} d="M12 6.5 16 12l-4 5.5"/>`,
  stack: `<path ${F} d="M12 2.5 22 7.5 12 12.5 2 7.5z"/><path ${S} d="M2 12l10 5 10-5M2 16.5l10 5 10-5"/>`,
  night: `<path ${F} d="M20.5 15.2A9.2 9.2 0 0 1 8.8 3.5a9.2 9.2 0 1 0 11.7 11.7z"/>`,
  dead: `<path ${F} d="M12 1.5a9.5 9.5 0 0 0-9.5 9.5c0 3.2 1.6 5.4 3.8 6.7v4.8h11.4v-4.8c2.2-1.3 3.8-3.5 3.8-6.7A9.5 9.5 0 0 0 12 1.5z"/><circle ${KF} cx="8.4" cy="11" r="2.3"/><circle ${KF} cx="15.6" cy="11" r="2.3"/><path ${K} d="M10 19.5v2M14 19.5v2"/>`,
  fight: `<path ${S} stroke-width="2.8" d="M4 3l12 12M20 3 8 15M13 18l5-5M6 13l5 5M17.5 17.5l3 3M6.5 17.5l-3 3"/>`,
  push: `<path ${S} stroke-width="3.2" d="M4.5 12 12 4.5l7.5 7.5M4.5 20 12 12.5l7.5 7.5"/>`,
  farm: `<ellipse ${F} cx="12" cy="5.5" rx="8.5" ry="3.5"/><path ${S} d="M3.5 10c0 1.9 3.8 3.5 8.5 3.5s8.5-1.6 8.5-3.5M3.5 14.5c0 1.9 3.8 3.5 8.5 3.5s8.5-1.6 8.5-3.5M3.5 19c0 1.9 3.8 3.5 8.5 3.5s8.5-1.6 8.5-3.5"/>`,
  ward: `<path ${F} d="M1 12S5 4.5 12 4.5 23 12 23 12s-4 7.5-11 7.5S1 12 1 12z"/><circle ${KF} cx="12" cy="12" r="3.6"/>`,
  target: `<circle ${S} cx="12" cy="12" r="8"/><path ${S} d="M12 1v5.5M12 17.5V23M1 12h5.5M17.5 12H23"/><circle ${F} cx="12" cy="12" r="2.2"/>`,
  ok: `<path ${S} stroke-width="3.4" d="M3.5 12.5l5.5 5.5L20.5 6"/>`,
  mic: `<path ${F} d="M12 2a3.5 3.5 0 0 0-3.5 3.5v6a3.5 3.5 0 0 0 7 0v-6A3.5 3.5 0 0 0 12 2z"/><path ${S} d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/>`};
const ico = n => `<svg class="ico" viewBox="0 0 24 24">${ICONS[n] || ICONS.danger}</svg>`;
const ACT = {farm_lane: ['FARM', 'farm'], farm_jungle: ['JUNGLE', 'farm'], gank: ['GANK', 'target'], group: ['GROUP', 'fight'], push: ['PUSH', 'push'],
  defend: ['DEFEND', 'push'], take_objective: ['OBJECTIVE', 'push'], roshan: ['ROSH', 'rosh'], stack_pull: ['STACK', 'stack'], ward: ['WARD', 'ward'],
  retreat: ['BACK', 'back'], heal_base: ['HEAL', 'back']};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`), num = v => typeof v === 'number' && Number.isFinite(v);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const cut = (s, n) => (s = String(s ?? '')).length > n ? s.slice(0, n - 1) + '…' : s;
// player-facing text: no model names, no probabilities, readable hero keys ("Jev: retreat 68%" -> "retreat")
const clean = t => String(t ?? '').replace(/\bjev\b:?\s*/gi, '').replace(/\s*\(?\b\d+(\.\d+)?\s?%\)?/g, '').replace(/\+/g, ' + ').replace(/_/g, ' ').replace(/\s{2,}/g, ' ').trim();
const CAUSE = /^(SMOKE\??|DANGER|GANK|FIGHT|MISSING|\d+ MISSING)$/i, SAFE = ['BACK', 'HEAL', 'GROUP', 'DEFEND'];   // a cause word gives way to the action
const DIRT = {river: 'from the river', jungle: 'from the jungle', behind: 'behind you'};   // alerts[].dir on a gank call
const pos = ['left', 'right', 'top'].includes(Q.get('pos')) ? Q.get('pos') : 'left';
document.documentElement.style.setProperty('--s', Math.max(.3, Math.min(4, parseFloat(Q.get('scale')) || 1)));
let W = {}, last = 0, heard = {text: null, at: 0};
const turbo = () => W.game?.mode === 'turbo';
const phase = () => W.phase || (() => { const c = W.game?.clock, k = turbo() ? .5 : 1; return !num(c) ? 'laning' : c < 0 ? 'pre' : c < 600 * k ? 'laning' : c < 1800 * k ? 'mid' : 'late'; })();
const relevant = n => !(phase() === 'late' && /^(Stack|Lotus|Bounty runes|Water rune)$/.test(n)) && !(phase() !== 'laning' && /^(Stack|Lotus|Wisdom shrine)$/.test(n));

// ---- danger direction (W.hud from rules.py) ----
const CDN = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/icons/';
const hshort = h => String(h || '').replace('npc_dota_hero_', '');
const KCOL = {seen: 'var(--high)', smoke: 'var(--warn)', missing: 'var(--warn)', fight: 'var(--ink)'};   // a seen enemy is red; smoke / missing are guesses: amber; fight-join is ink
// world (GSI x,y) -> overlay px over the real minimap: affine A gives minimap-crop px (crop is resampled square), then frame px, then window px
function mmPt(x, y) {
  const cv = W.cv || {}, A = cv.A, r = cv.minimap_rect, sz = cv.size;
  if (!cv.affine_ok || !A || !r || !sz || !num(x) || !num(y)) return null;
  const u = A[0][0] * x + A[0][1] * y + A[0][2], v = A[1][0] * x + A[1][1] * y + A[1][2];
  return [(r[0] + u) * innerWidth / sz[0], (r[1] + v * r[3] / r[2]) * innerHeight / sz[1]];
}
const mmScale = () => { const cv = W.cv || {}; return cv.A && cv.size ? Math.hypot(cv.A[0][0], cv.A[0][1]) * innerWidth / cv.size[0] : 0; };
// LEGACY (a server without hud.fog): today's arrows and marks, verbatim. coach.py restarts a crashed overlay, which loads this file against the
// old server in the middle of a game: that must look exactly as before. Delete arrowsOld / marksOld once every server sends hud.fog.
function arrowsOld(hud, me, dg) {
  // one arrow per 45-degree sector; screen angle = world angle with y flipped (top-down camera)
  const sec = {}, out = [];
  const add = (x, y, kind, hero, eta) => {
    const dx = x - me.x, dy = y - me.y; if (Math.hypot(dx, dy) < 500) return;
    const a = Math.atan2(-dy, dx), k = Math.round(a / (Math.PI / 4)) & 7;
    const s = sec[k] ||= {a: 0, n: 0, heroes: [], kind}; s.a += a; s.n++;  // ponytail: averaging angles breaks across ±180°; sectors keep it local
    if (num(eta)) s.eta = Math.min(s.eta ?? 1e9, eta);
    if (hero && !s.heroes.includes(hero)) s.heroes.push(hero); if (kind === 'seen' || (kind === 'smoke' && s.kind !== 'seen')) s.kind = kind;
  };
  for (const t of hud.threats || []) add(t.x, t.y, t.kind, t.hero);
  for (const [s, e] of Object.entries(W.heroes || {}))  // every enemy in sight nearby, not only at danger 2+ (player, 2026-11-12)
    if (e && !e.ally && e.visible && !e.dead && num(e.x) && Math.hypot(e.x - me.x, e.y - me.y) <= 2500) add(e.x, e.y, 'seen', s);
  for (const m of hud.mia || []) {  // walked into fog: where it could be now (reach circle r); only if it could be on me within ~12 s
    const eta = Math.max(0, Math.hypot(m.x - me.x, m.y - me.y) - (m.r || 0)) / 350;
    if (eta <= 12) add(m.x, m.y, 'missing', m.hero, Math.round(eta));
  }
  if (hud.fight) add(hud.fight.x, hud.fight.y, 'fight');

    if (ac && SAFE.includes(ac.word) && (!big || CAUSE.test(word))) { word = ac.word; icn = ac.icon; }   // say the action; the cause is the subtitle
    const dir = DIRT[a.dir || (Array.isArray(W.alerts) ? W.alerts : []).find(x => x && x.dir && String(x.rule || x.id).startsWith('R1'))?.dir];
    if (mia >= 3 && !/MISSING/i.test(word)) sub = `${mia} missing${dir ? ' · ' + dir : ''}`; else if (dir) sub = dir;
    p = [`big ${big ? lv : 'high'}`, `${ico(icn)}<span>${esc(cut(word, 16))}</span>${sub ? `<small>${esc(cut(sub, 44))}</small>` : ''}`
      + (dg >= 3 ? `<span class="meter">${[1, 2, 3, 4].map(i => `<i class="${i <= dg ? 'on' : ''}"></i>`).join('')}</span>` : '')];   // danger meter only at level 3+
  } else if (ingame && alive) {
    const r = W.obj?.rosh || {}, k = turbo() ? .5 : 1, lo = num(r.killed_at) && r.killed_at < 1e8 ? r.killed_at + 480 * k : null, hi = lo != null ? r.killed_at + 660 * k : null;
    const rw = r.state === 'dead' && lo != null && num(clock) && clock >= lo - 60 && clock <= hi ? (clock < lo ? `ROSH ${fmt(lo - clock)}` : 'ROSH WINDOW') : null;
    const t = (Array.isArray(W.timers) ? W.timers : []).filter(x => x && relevant(x.name)).map(x => ({...x, s: num(x.at_clock) && num(clock) ? x.at_clock - clock : x.in_s}))
      .filter(x => num(x.s) && x.s > 0 && x.s <= (num(x.lead) ? x.lead : 0)).sort((x, y) => x.s - y.s)[0];
    if (ac && ['BACK', 'HEAL', 'GROUP'].includes(ac.word)) p = [ac.word === 'GROUP' ? '' : 'warn', `${ico(ac.icon)}<span>${esc(ac.word)}</span>${mia >= 3 ? `<small>${mia} missing</small>` : ''}`];
    else if (r.state === 'maybe' || String(g.rosh ?? '').startsWith('maybe')) p = ['warn', `${ico('rosh')}<span>ROSH MAYBE</span>`];
    else if (rw) p = ['', `${ico('rosh')}<span>${rw}</span>`];
    else if (t) p = ['', `<span>${esc(t.name)}</span><span>${fmt(t.s)}</span>`];
  }
  // mic badge (W.talk.stage): REC + waves while you are heard, then THINKING / COACH while the reply is on its way
  const mk = {recording: ['', tk.partial ? cut(tk.partial, 40) : 'REC'], transcribing: ['think', 'heard'], thinking: ['think', 'thinking'], speaking: ['speak', 'coach']}[tk.stage];
  $('mic').hidden = !mk || offline;
  if (mk) { $('mic').className = mk[0]; $('micl').textContent = mk[1]; }
  const el = $('pill'), q = $('q');
  el.hidden = !p;
  if (p) { if (el._h !== p[1]) el.innerHTML = el._h = p[1]; el.className = 'pill ' + p[0]; }
  // told to be quiet (W.coach.quiet, or verbosity low) or voice off: say so on the game screen, so silence is not mistaken for a broken coach
  const mark = !ingame ? '' : W.settings?.voice === false ? 'voice off' : co.quiet === true || W.settings?.quiet === true || (W.settings?.verbosity || co.verbosity) === 'low' ? 'quiet' : '';
  q.hidden = !mark; q.textContent = mark;
  renderFx(ingame && !/POST_GAME|DISCONNECT/.test(W.game.state), lv);   // the end screen: every map mark and arrow leaves (user 2026-11-24)
  document.body.style.visibility = W.settings?.overlay === false ? 'hidden' : '';  // dashboard toggle
  $('hud').className = pos + (p || mark ? '' : ' calm');
}

if (Q.has('mock')) {
  // States cycle every 4 s; ?mock&sc=<name> pins one. Each is a patch over a calm in-game world (glance is merged, the rest replaced).
  const A = (level, word, icon, text, id) => ({level, word, icon, text, id, sticky: true}), T = (hero, x, y, kind) => ({hero: 'npc_dota_hero_' + hero, x, y, kind});
  const BACK = {word: 'BACK', icon: 'back', p: .68}, MIA = [{hero: 'npc_dota_hero_zuus', x: 3000, y: 2500, r: 1800}];
  const CYC = {
    calm: {},   // nothing at all on screen
    warn: {attention: A('warn', 'GANK', 'danger', 'Likely gank: back toward tower', 'R1:1'), glance: {danger: 2, mia: 4, action: BACK}, hud: {threats: [T('lion', -2600, 600, 'seen')], mia: MIA}},
    high: {attention: A('high', 'GANK', 'danger', 'Gank: sven+lion on you', 'R1:2'), alerts: [{id: 'R1:2', rule: 'R1', level: 'high', dir: 'river'}], glance: {danger: 4, mia: 2, action: BACK},
      hud: {threats: [T('sven', 600, -900, 'seen'), T('lion', 300, -1400, 'seen')]}},
    missing: {attention: A('info', '3 MISSING', 'missing', '3 missing: farm closer to tower', 'R2'), glance: {danger: 1, mia: 3}, hud: {mia: MIA}},   // R2/R3 arrive as info: amber
    smoke: {attention: A('info', 'SMOKE?', 'smoke', 'Possible smoke: phantom_assassin+pudge vanished near you', 'R3:9'), glance: {danger: 2, mia: 2}, hud: {threats: [T('phantom_assassin', 600, -900, 'smoke')]}},
    old: {attention: A('warn', 'BACK', 'back', 'Jev: retreat 68%', 'jev'), glance: {danger: 3, mia: 1, action: BACK}},   // an older server's text: the name and the % are stripped
    listen: {talk: {stage: 'recording', partial: 'where is their'}},
    heard: {talk: {stage: 'thinking', heard: 'where is their carry'}},
    quiet: {coach: {quiet: true}},   // only the QUIET marker
    timer: {timers: [{name: 'Wisdom shrine', in_s: 18, lead: 30}], hud: {fight: {x: 1500, y: -4800, allies: 2, foes: 2}}}};
  // ---- fog layer scenes (?mock&sc=fog_*): hud.fog exactly as fog.py sends it. Geometry, me and the five enemies are those of the recorded frame the
  // preview harness puts behind the page, so every mark can be checked against the real minimap. &small=1 = the same frame on the MacBook screen.
  const kx = Q.has('small') ? 1728 / 2560 : 1, ky = Q.has('small') ? 1117 / 1440 : 1;
  const CV = {affine_ok: true, size: [2560 * kx, 1440 * ky], minimap_rect: [2186 * kx, 1159 * ky, 374 * kx, 325 * ky], A: [[.021052 * kx, 0, 186.63 * kx], [0, -.02107 * kx, 187.8 * kx]], icon_px: 31 * kx};
  const SLOT = {silencer: 0, slark: 1, dragon_knight: 2, death_prophet: 3, mirana: 4};
  const G = (hero, age, x, y, conf, o) => ({hero, slot: SLOT[hero] ?? 4, age, x, y, conf, src: 'seen', p10: .05, tier: 0, ttl: 0, ...o});
  const FOES = Object.fromEntries(Object.keys(SLOT).map(h => [h, {team: 'dire', ally: false, visible: false}]));   // the enemies are known: their icons are preloaded
  const FW = (fog, o) => ({me: {alive: true, x: -2047, y: -802}, heroes: FOES, ...o, hud: {fog, ...o?.hud}});
  const DK = G('dragon_knight', 19, 6177, -3900, .13), CLOSE = [DK, G('mirana', 5, -900, 600, .5, {p10: .44, tier: 2, ttl: .75}), G('silencer', 7, -500, 0, .45, {p10: .41, tier: 2, ttl: .6})];
  const FRESH = [G('death_prophet', 4, 1500, 2500, .49), G('dragon_knight', 7, 6177, -3900, .31), G('mirana', 9, 300, 3900, .27)];
  const DARK = [[2, .85], [3.5, .55], [5, .36], [8, .3], [11, .22], [14, .16], [20, .12], [45, .08]];   // fog.py CONF_DARK
  const dark = a => { const i = DARK.findIndex(k => a <= k[0]), p = DARK[i - 1], q = DARK[i]; return i < 0 ? .08 : !p ? .85 : p[1] + (q[1] - p[1]) * (a - p[0]) / (q[0] - p[0]); };
  Object.assign(CYC, {
    radar: FW([G('death_prophet', 3, -1300, -300, .55, {p10: .5, tier: 2}), G('mirana', 25, 4500, 3800, .12, {p10: .02})], {heroes: {...FOES, silencer: {team: 'dire', ally: false, visible: true, x: -1500, y: -1900, slot: 0},
      slark: {team: 'dire', ally: false, visible: true, x: 3000, y: 1500, slot: 1}, lich: {team: 'radiant', ally: true, visible: true, x: -4200, y: -1500}, dragon_knight: {team: 'dire', ally: false, visible: false, dead: true, slot: 2}, mirana: {...FOES.mirana, slot: 4}, death_prophet: {...FOES.death_prophet, slot: 3}}}),   // near + far in sight, fresh close fog, old far fog, dead
    fog_calm: FW([]),   // all enemies in sight or dead: nothing
    fog_fresh: FW([...FRESH, G('silencer', 1.5, -1550, -310, .9, {p10: .68})]),   // ghosts at 4 s and 7 s; 9 s = chip only; 1.5 s = nothing yet
    fog_lit: FW([G('dragon_knight', 20, -1200, -2600, .36, {p10: .09})]),   // vanished inside my team's vision: the ghost lasts
    fog_faint: FW([G('death_prophet', 4, 4500, 3800, .49), G('dragon_knight', 9, 6177, -3900, .27), G('mirana', 6, 100, 900, .34, {p10: .22, tier: 1, ttl: .8})]),
    fog_cued_stale: FW([G('mirana', 12, 100, 900, .2, {p10: .21, tier: 1, ttl: .4})]),   // confidence has run out, the cue keeps the mark on the map
    fog_close: FW(CLOSE),
    fog_drain: FW([{...DK, age: 28, conf: .1}, G('mirana', 14, -900, 600, .16, {p10: .35, tier: 2, ttl: .15}), G('silencer', 16, -500, 0, .15, {p10: .26, tier: 2, ttl: .1})]),
    fog_stale: FW([G('slark', 48, -6000, 2500, .08), G('dragon_knight', 95, 6177, -3900, .08), G('death_prophet', 12, null, null, 0, {src: 'respawn', p10: .03})]),   // strip only
    fog_hint: FW([G('death_prophet', 3, 2500, -2500, .45, {src: 'hint'})]),   // placed by a summon: dashed ring
    fog_seen: FW([G('silencer', 6, -3900, -1500, .34, {p10: .41, tier: 2, ttl: .7}), G('mirana', 5, -600, 1500, .36, {p10: .4, tier: 2, ttl: .8})], {hud: {threats: [T('slark', -1100, 900, 'seen')]}}),   // Mirana shares Slark's sector: no fog icon on the red arrow
    fog_dead: FW(FRESH.map(e => ({...e, p10: 0})), {me: {alive: false, x: -2047, y: -802}}),   // ghosts and strip stay, no cue
    fog_noaffine: FW(CLOSE, {cv: {...CV, affine_ok: false}}),   // strip and cue only
    fog_west: FW([], {hud: {threats: [T('sven', -4000, -600, 'seen'), T('lion', -4000, -1000, 'seen')]}}),   // either side of due west: the arrow is on the west edge
    fog_clump: FW([G('silencer', 4, -500, 0, .49), G('dragon_knight', 4, -520, 30, .49), G('mirana', 4, -480, -20, .49)]),   // three vanish on one spot: side by side, top-bar order
    fog_nosprite: FW([G('no_such_hero', 12, 100, 900, .5, {p10: .3, tier: 1, ttl: .5})]),   // icon fails to load: nothing is drawn for that hero
    fog_legacy: {...CYC.warn, cv: {affine_ok: true, size: [2560, 1440], minimap_rect: [2190, 1070, 370, 370], A: [[.021, 0, 186], [0, -.021, 189]]}},   // no hud.fog (an older server), the old mock geometry: pixel for pixel the overlay before the fog layer
    // animated (t = seconds since load, fixtures at 4 Hz); only by ?sc=
    fog_flicker: t => { const u = t % 12, g = [[1, 1.5], [3, 4.9], [6, 7.5], [8, 9.5]].find(g => u >= g[0] && u < g[1]);   // an icon 700 u away drops out for 0.5 / 1.9 / 1.5 / 1.5 s: nothing may show
      return FW(g ? [G('mirana', u - g[0], -1550, -310, .85, {p10: .68})] : []); },
    fog_empty: t => FW(t % 9 >= 3 && t % 9 < 6 ? [] : CLOSE),   // hud.fog turns [] for 3 s (GSI silent, or the backend guard tripped) and comes back
    fog_life: t => { const a = t * 4 % 48 - 4; return FW(a < 0 ? [] : [G('death_prophet', a, 1500, 2500, +dark(a).toFixed(2))]); }});   // 4x: vanish -> ghost -> fade -> chip up to 44 s
  const names = Object.keys(CYC), pin = names.includes(Q.get('sc')) ? Q.get('sc') : null, cyc = names.filter(k => typeof CYC[k] !== 'function');
  let n = 0, c = 300;
  const tick = () => {
    n++; c += .25; last = Date.now();
    const s = CYC[pin || cyc[Math.floor(n / 16) % cyc.length]], m = typeof s === 'function' ? s(n / 4) : s;
    W = {game: {state: 'DOTA_GAMERULES_STATE_GAME_IN_PROGRESS', clock: c}, attention: {level: 'none', sticky: false}, me: {alive: true, x: -2000, y: -1500}, settings: {},
      cv: CV,
      hud: {}, obj: {rosh: {state: 'alive', pit: 'bot'}}, timers: [], talk: {stage: 'idle'}, coach: {quiet: false, verbosity: 'normal'},
      ...m, glance: {danger: 0, mia: 1, rosh: 'alive', action: {word: 'JUNGLE', icon: 'farm', p: .55}, ...m.glance}, ...window.MOCK_W};   // MOCK_W: a recorded world row (screenshots of real moments)
    render();
  };
  tick(); setInterval(tick, 250);
} else {
  const es = new EventSource('/events');   // reconnects on its own
  es.onmessage = ev => { try { W = JSON.parse(ev.data) || {}; last = Date.now(); render(); } catch (e) { console.error('bad event', e); } };
  let build = null;  // server restarted with new code -> reload
  es.onopen = () => fetch('/version').then(r => r.json()).then(v => { if (build && v.src_hash !== build) location.reload(); build = v.src_hash; }).catch(() => {});
  setInterval(render, 2000);
}
render();
</script>
