[project]
name = "live-coach"
version = "0.1.1"
description = "Local second-monitor Dota 2 coach: GSI + classical CV + rules + occasional LLM"
requires-python = ">=3.13,<3.15"
dependencies = [
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "pyobjc-core==13.0",
  "pyobjc-framework-ScreenCaptureKit==13.0",
  "pyobjc-framework-libdispatch==13.0",
  "pyobjc-framework-Cocoa==13.0",
  "pyobjc-framework-WebKit==13.0",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "vpk==1.4.0",
  "vdf==3.4",
  "pyobjc-framework-speech==13.0",
  "pyobjc-framework-avfoundation==13.0",
  "anthropic>=2.8.0",
  "obsws-python>=1.8.1",
  "pyobjc-framework-vision==13.0",
]

[tool.uv]
package = false
